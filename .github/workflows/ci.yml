name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python tools/dev.py check
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Godot
        shell: bash
        run: |
          version=$(cat .godot-version)
          asset="Godot_v${version}-stable_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl --fail --location "$base/$asset" --output "$RUNNER_TEMP/$asset"
          curl --fail --location "$base/SHA512-SUMS.txt" --output "$RUNNER_TEMP/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP"
          grep " $asset\$" SHA512-SUMS.txt | sha512sum --check --strict
          unzip "$asset" -d godot
          chmod +x "godot/Godot_v${version}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: python tools/dev.py godot-test
